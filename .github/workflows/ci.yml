# Fast checks on every push and pull request (CLAUDE.md conventions).
# The Gemini eval (npm run eval) needs Google Cloud credentials, so it runs by
# hand before a release, not here. Firestore rules tests will join this job
# on the emulator (ADR-0011 D3).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (price parser, trust checks, proposal validation)
        run: npm test
      - name: Published JSON Schema matches the Zod schema
        run: npm run schema:check
